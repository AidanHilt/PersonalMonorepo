image:
  repository: ghcr.io/amruthpillai/reactive-resume
  pullPolicy: IfNotPresent

service:
  main:
    ports:
      http:
        port: 80
        targetPort: 3000

#=============================
# Application-specific config
#=============================
rxresu:
  postgres:
    enabled: false

    username: rxresu
    password: ""

    port: 5432
    host: postgres-cluster-rw.postgres.svc.cluster.local

    dbName: rxresu

