{{- if .Values.bazarr.enabled -}}
{{- $c := .Values.bazarr -}}
apiVersion: v1
kind: Secret
metadata:
  name: bazarr-config-yaml
stringData:
  config.yaml: |
    addic7ed:
      cookies: ''
      password: ''
      user_agent: ''
      username: ''
      vip: false
    analytics:
      enabled: true
    anidb:
      api_client: ''
      api_client_ver: 1
    animetosho:
      anidb_api_client: ''
      anidb_api_client_ver: 1
      search_threshold: 6
    anticaptcha:
      anti_captcha_key: ''
    assrt:
      token: ''
    auth:
      apikey: {{ $c.auth.apikey | quote }}
      password: {{ $c.auth.password | quote }}
      type: {{ $c.auth.type }}
      username: {{ $c.auth.username | quote }}
    avistaz:
      cookies: ''
      user_agent: ''
    backup:
      day: {{ $c.backup.day }}
      folder: {{ $c.backup.folder | quote }}
      frequency: {{ $c.backup.frequency | quote }}
      hour: {{ $c.backup.hour }}
      retention: {{ $c.backup.retention }}
    betaseries:
      token: ''
    cinemaz:
      cookies: ''
      user_agent: ''
    cors:
      enabled: false
    deathbycaptcha:
      password: ''
      username: ''
    embeddedsubtitles:
      fallback_lang: en
      hi_fallback: false
      included_codecs: []
      timeout: 600
      unknown_as_fallback: false
    general:
      adaptive_searching: true
      adaptive_searching_delay: 3w
      adaptive_searching_delta: 1w
      anti_captcha_provider: null
      auto_update: true
      base_url: {{ $c.general.base_url | quote }}
      branch: master
      chmod: '0640'
      chmod_enabled: false
      concurrent_jobs: 4
      days_to_upgrade_subs: {{ $c.general.days_to_upgrade_subs }}
      debug: false
      default_und_audio_lang: ''
      default_und_embedded_subtitles_lang: ''
      dont_notify_manual_actions: false
      embedded_subs_show_desired: true
      embedded_subtitles_parser: ffprobe
      enable_strm_support: false
      enabled_integrations: []
      enabled_providers: []
      external_webhook_password: ''
      external_webhook_url: ''
      external_webhook_username: ''
      flask_secret_key: {{ $c.general.flask_secret_key | quote }}
      hi_extension: hi
      hostname: ''
      ignore_ass_subs: false
      ignore_pgs_subs: false
      ignore_vobsub_subs: false
      instance_name: {{ $c.general.instance_name | quote }}
      ip: {{ $c.general.ip | quote }}
      language_equals: []
      minimum_score: {{ $c.general.minimum_score }}
      minimum_score_movie: {{ $c.general.minimum_score_movie }}
      movie_default_enabled: false
      movie_default_profile: ''
      movie_tag_enabled: false
      multithreading: true
      page_size: 25
      parse_embedded_audio_track: false
      path_mappings: []
      path_mappings_movie: []
      port: {{ $c.general.port }}
      postprocessing_cmd: ''
      postprocessing_threshold: 90
      postprocessing_threshold_movie: 70
      remove_profile_tags: []
      serie_default_enabled: false
      serie_default_profile: ''
      serie_tag_enabled: false
      single_language: {{ $c.general.single_language }}
      skip_hashing: false
      subfolder: current
      subfolder_custom: ''
      subzero_mods: ''
      theme: auto
      upgrade_frequency: {{ $c.general.upgrade_frequency }}
      upgrade_manual: {{ $c.general.upgrade_manual }}
      upgrade_subs: {{ $c.general.upgrade_subs }}
      use_embedded_subs: {{ $c.general.use_embedded_subs }}
      use_external_webhook: false
      use_plex: {{ $c.general.use_plex }}
      use_postprocessing: false
      use_postprocessing_threshold: false
      use_postprocessing_threshold_movie: false
      use_radarr: {{ $c.general.use_radarr }}
      use_scenename: true
      use_sonarr: {{ $c.general.use_sonarr }}
      utf8_encode: true
      wanted_search_frequency: 6
      wanted_search_frequency_movie: 6
    hdbits:
      passkey: ''
      username: ''
    jimaku:
      api_key: ''
      enable_ai_subs: false
      enable_archives_download: false
      enable_name_search_fallback: true
    karagarga:
      f_password: ''
      f_username: ''
      password: ''
      username: ''
    ktuvit:
      email: ''
      hashed_password: ''
    legendasdivx:
      password: ''
      skip_wrong_fps: false
      username: ''
    legendasnet:
      password: ''
      username: ''
    log:
      exclude_filter: ''
      ignore_case: false
      include_filter: ''
      use_regex: false
    movie_scores:
      audio_codec: 3
      edition: 1
      hash: 119
      hearing_impaired: 1
      release_group: 13
      resolution: 2
      source: 7
      streaming_service: 1
      title: 60
      video_codec: 2
      year: 30
    napiprojekt:
      only_authors: false
      only_real_names: false
    napisy24:
      password: ''
      username: ''
    opensubtitlescom:
      include_ai_translated: {{ $c.opensubtitlescom.include_ai_translated }}
      include_machine_translated: {{ $c.opensubtitlescom.include_machine_translated }}
      password: {{ $c.opensubtitlescom.password | quote }}
      use_hash: {{ $c.opensubtitlescom.use_hash }}
      username: {{ $c.opensubtitlescom.username | quote }}
    podnapisi:
      verify_ssl: true
    postgresql:
      database: {{ $c.postgresql.database | quote }}
      enabled: {{ $c.postgresql.enabled }}
      host: {{ $c.postgresql.host | quote }}
      password: {{ $c.postgresql.password | quote }}
      port: {{ $c.postgresql.port }}
      url: {{ $c.postgresql.url | quote }}
      username: {{ $c.postgresql.username | quote }}
    proxy:
      exclude:
      {{- range $c.proxy.exclude }}
      - {{ . }}
      {{- end }}
      password: {{ $c.proxy.password | quote }}
      port: {{ $c.proxy.port | quote }}
      type: {{ $c.proxy.type }}
      url: {{ $c.proxy.url | quote }}
      username: {{ $c.proxy.username | quote }}
    radarr:
      apikey: {{ .Values.radarr.apiKey | quote }}
      base_url: {{ .Values.radarr.urlBase | quote }}
      defer_search_signalr: false
      excluded_tags: []
      full_update: "Daily"
      full_update_day: 6
      full_update_hour: 4
      http_timeout: 60
      ip: {{ .Values.radarr.hostname | quote }}
      movies_sync: 60
      movies_sync_on_live: true
      only_monitored: false
      port: {{ .Values.radarr.port }}
      ssl: false
      sync_only_monitored_movies: false
      use_ffprobe_cache: true
    series_scores:
      audio_codec: 3
      episode: 30
      hash: 359
      hearing_impaired: 1
      release_group: 14
      resolution: 2
      season: 30
      series: 180
      source: 7
      streaming_service: 1
      video_codec: 2
      year: 90
    sonarr:
      apikey: {{ .Values.sonarr.apiKey | quote }}
      base_url: {{ .Values.sonarr.urlBase | quote }}
      defer_search_signalr: false
      excluded_tags: []
      full_update: "Daily"
      full_update_day: 6
      full_update_hour: 4
      http_timeout: 60
      ip: {{ .Values.sonarr.hostname | quote }}
      movies_sync: 60
      movies_sync_on_live: true
      only_monitored: false
      port: {{ .Values.sonarr.port }}
      ssl: false
      sync_only_monitored_movies: false
      use_ffprobe_cache: true
    subdl:
      api_key: ''
    subf2m:
      user_agent: ''
      verify_ssl: true
    subsource:
      apikey: ''
    subsync:
      checker:
        blacklisted_languages: []
        blacklisted_providers: []
      debug: false
      force_audio: false
      gss: true
      max_offset_seconds: 60
      no_fix_framerate: true
      subsync_movie_threshold: 70
      subsync_threshold: 90
      use_subsync: false
      use_subsync_movie_threshold: false
      use_subsync_threshold: false
    subx:
      api_key: ''
    titlovi:
      password: ''
      username: ''
    titulky:
      approved_only: false
      password: ''
      skip_wrong_fps: false
      username: ''
    translator:
      default_score: 50
      gemini_key: {{ $c.translator.gemini_key | quote }}
      gemini_model: {{ $c.translator.gemini_model | quote }}
      lingarr_token: {{ $c.translator.lingarr_token | quote }}
      lingarr_url: {{ $c.translator.lingarr_url | quote }}
      translator_info: true
      translator_type: {{ $c.translator.translator_type | quote }}
    turkcealtyaziorg:
      cookies: ''
      user_agent: ''
    whisperai:
      endpoint: {{ $c.whisperai.endpoint | quote }}
      loglevel: INFO
      pass_video_name: false
      response: 5
      timeout: {{ $c.whisperai.timeout }}
    xsubs:
      password: ''
      username: ''
{{- end }}