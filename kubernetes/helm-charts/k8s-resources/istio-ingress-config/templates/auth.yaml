---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: prowlarr-ingress-custom
  namespace: istio-system
spec:
  action: CUSTOM
  provider:
    name: authentik
  rules:
  - to:
    - operation:
        hosts:
        - qa-cluster-lb.lan
        paths:
        - /prowlarr
        - /prowlarr/*
        notPaths:
        - /outpost.goauthentik.io/*
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: prowlarr-ingress-istio
  namespace: istio-system
spec:
  action: ALLOW
  rules:
  - to:
    - operation:
        hosts:
        - qa-cluster-lb.lan
        paths:
        - /prowlarr
        - /prowlarr/*
  selector:
    matchLabels:
      app: istio-gateway