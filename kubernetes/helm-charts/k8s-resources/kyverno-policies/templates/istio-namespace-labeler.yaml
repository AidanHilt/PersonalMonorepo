{{- if index .Values "istio-namespace-labeler" "enabled" }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: default-istio-injection
  annotations:
    policies.kyverno.io/title: Default Istio Injection
    policies.kyverno.io/description: >-
      Automatically adds istio-injection=enabled label to new namespaces
      unless explicitly excluded or disabled.
spec:
  background: true
  mutateExistingOnPolicyUpdate: true
  rules:
    - name: add-istio-injection-label
      match:
        any:
          - resources:
              kinds:
                - Namespace
      mutate:
        targets:
          - apiVersion: v1
            kind: Namespace
            name: "*"
            preconditions:
              all:
                - key: {{ `{{ target.metadata.name }}` | quote }}
                  operator: AnyNotIn
                  value:
                    - kube-system
                    - kube-public
                    - kube-node-lease
                    - istio-system
                    - vault
                    - postgres
                    - local-path-storage
                    - nvidia
                    - cert-manager
                    - kyverno
                    - metallb-system
                    - argocd
                - key: {{ `{{ target.metadata.annotations."istio.io/injection-policy" || '' }}` | quote }}
                  operator: NotEquals
                  value: "disabled"
        patchStrategicMerge:
          metadata:
            labels:
              +(istio-injection): "enabled"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-background-controller-namespaces
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "patch", "update"]
{{- end }}