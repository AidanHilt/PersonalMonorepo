authentik:
  enabled: false
  secretDestinationNamespace: authentik
  postgresSecret: true
  destination:
    transformation:
      templates:
        AUTHENTIK_SECRET_KEY:
          text: "{{ .Secrets.secretKey }}"
        AUTHENTIK_POSTGRESQL__PASSWORD:
          text: "{{ .Secrets.postgresPassword }}"
        AUTHENTIK_POSTGRESQL__USER:
          text: "{{ .Secrets.postgresUsername }}"
  data:
    postgresUsername: authentik
    postgresPassword:
      postgresPassword: true
    secretKey: {}
    AUTHENTIK_POSTGRESQL__HOST: postgres-cluster-rw.postgres.svc.cluster.local
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_BOOTSTRAP_PASSWORD: ""
    AUTHENTIK_BOOTSTRAP_TOKEN: ""
    AUTHENTIK_BOOTSTRAP_EMAIL:
      tfVar:
        name: email
        type: string
  namespace: authentik
  mount: authentik
bar-assistant:
  enabled: false
  secretDestinationNamespace: inventory-mgmt
  destination:
    transformation:
      templates:
        MEILI_MASTER_KEY:
          text: "{{ .Secrets.meilisearchApiKey }}"
  data:
    meilisearchApiKey:
      postgresPassword: false
  namespace: inventory-mgmt
  mount: inventory-mgmt
bazarr:
  enabled: false
  secretDestinationNamespace: videos
  data:
    postgresUser: bazarr
    postgresPassword:
      postgresPassword: true
