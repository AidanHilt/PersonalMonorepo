      templates:
        vpnConfig:
          text: |
            {{ .Secrets.vpnConfig | replace "\\n" "\n" }}
video-stack-configuration:
  enabled: false
  secretDestinationNamespace: videos
  resourceName: setup-job
  serviceAccount:
    create: true
your-spotify:
  enabled: false
  secretDestinationNamespace: your-spotify
  mount: misc
  serviceAccount:
    name: default
  namespace: your-spotify
  service_account: default
  data:
    spotifyPublic:
      tfVar:
        name: spotify_public
        type: string
        default: XXXX
    spotifyPrivate:
      tfVar:
        name: spotify_private
        type: string
        default: XXXXXXXX
    mongodbPassword: {}
video_stack_configuration:
  serviceAccounts:
    - argocd-repo-server
  auth:
    path: ""
    role_name: argocd
  data:
    jellyfinEmail:
      tfVar:
        name: email
        type: string
    jellyfinPassword:
      key_name: jellyfin-password
    jellyfinUsername:
      tfVar:
        name: jellyfin_username
        type: string
        default: admin
    jellyseerrApiKey:
      key_name: jellyseerr-apiKey
    prowlarrApiKey:
      key_name: prowlarr-apiKey
    radarrApiKey:
      key_name: radarr-apiKey
    sonarrApiKey:
      key_name: sonarr-apiKey
    lidarrApiKey:
      key_name: lidarr-apiKey
    openSubtitlesUsername:
      tfVar:
        name: open_subtitles_username
        type: string
        default: user
    openSubtitlesPassword:
      tfVar:
        name: open_subtitles_password
        type: string
        default: password
  mount: argocd
  namespace: argocd
  path: video_stack_configuration
vpn:
  data:
    VPN_AUTH:
      tfVar:
        name: vpn_auth
        type: string
    vpnConfig:
      tfVar:
        name: vpn_config
        type: string
  mount: videos
  namespace: videos
  serviceAccounts:
    - transmission
