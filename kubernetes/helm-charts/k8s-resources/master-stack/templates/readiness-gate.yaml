{{- $excludedNames := list "env" "hostnames" "defaultGitRepo" "gitRevision" "configuration" }}
{{- $kubectlImage := "dtzar/helm-kubectl:4.2" }}

{{- $hasGates := false }}
{{- range $appName, $app := .Values }}
{{- if not (has $appName $excludedNames) }}
{{- $appDetails := include "common.mergeGroupOverrides" (dict "item" $app "itemName" $appName "Values" $.Values) | fromYaml }}
{{- if and $appDetails.enabled $appDetails.readinessGateCheck }}
{{- $hasGates = true }}
{{- end }}
{{- end }}
{{- end }}

{{- if $hasGates }}
apiVersion: v1
kind: Namespace
metadata:
  name: readiness-canary
  annotations:
    argocd.argoproj.io/sync-wave: "-1000"
  labels:
    istio-injection: enabled
    readiness-gate/canary: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: readiness-gate
  namespace: readiness-canary
  annotations:
    argocd.argoproj.io/sync-wave: "-1000"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: readiness-gate
  namespace: readiness-canary
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readiness-gate
  namespace: readiness-canary
subjects:
  - kind: ServiceAccount
    name: readiness-gate
    namespace: readiness-canary
roleRef:
  kind: Role
  name: readiness-gate
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: readiness-gate
  annotations:
    argocd.argoproj.io/sync-wave: "-1000"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: readiness-gate
  annotations:
    argocd.argoproj.io/sync-wave: "-1000"
subjects:
  - kind: ServiceAccount
    name: readiness-gate
    namespace: readiness-canary
roleRef:
  kind: ClusterRole
  name: readiness-gate
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}

{{- range $appName, $app := .Values }}
{{- if not (has $appName $excludedNames) }}
{{- $appDetails := include "common.mergeGroupOverrides" (dict "item" $app "itemName" $appName "Values" $.Values) | fromYaml }}
{{- if and $appDetails.enabled $appDetails.readinessGateCheck }}
{{- if not $appDetails.syncWave }}
{{ fail (printf "app '%s' has readinessGateCheck set but no syncWave defined" $appName) }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $appName }}-readiness-gate
  namespace: readiness-canary
  annotations:
    argocd.argoproj.io/sync-wave: {{ $appDetails.syncWave | quote }}
    argocd.argoproj.io/compare-options: Replace=true,Force=true
spec:
  backoffLimit: {{ $appDetails.readinessGateCheck.backoffLimit | default 1 }}
  activeDeadlineSeconds: {{ $appDetails.readinessGateCheck.timeoutSeconds | default 300 }}
  template:
    spec:
      serviceAccountName: readiness-gate
      restartPolicy: Never
      containers:
        - name: check
          image: {{ $kubectlImage | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
{{ $appDetails.readinessGateCheck.command | indent 14 }}
---
{{- end }}
{{- end }}
{{- end }}