# Global config
env: qa-cluster
hostnames:
  - localhost
# The default repo we read from for applications that use a git provider
defaultGitRepo: https://github.com/AidanHilt/PersonalMonorepo
# This is the version of Atils resources we are targeting. That means this is the branch that our own Helm charts will use, as well as any of our static config
# This is also the branch that will be used for configuration (i.e. values files), unless configuration.configurationRevision is set below
gitRevision: master
configuration:
  configurationRepo: https://github.com/AidanHilt/PersonalMonorepo
  configurationDirectory: kubernetes/argocd/configuration-data
  # If left unset, will use the value of gitRevision above
  configurationRevision: ""


audiobookshelf:
  enabled: false
  gitPath: kubernetes/helm-charts/applications/audiobookshelf
  destinationNamespace: books
authentik:
  enabled: false
  repo: https://charts.goauthentik.io
  chart: authentik
  version: 2026.5.0
  destinationNamespace: authentik
bar-assistant:
  enabled: false
  gitPath: kubernetes/helm-charts/applications/bar-assistant
  destinationNamespace: inventory-mgmt
bazarr:
  enabled: false
  gitPath: kubernetes/helm-charts/applications/bazarr
  destinationNamespace: videos
  groupName: videos
bentopdf:
  enabled: false
  repo: https://kriegalex.github.io/k8s-charts/
  chart: bentopdf
  version: 1.0.1
  destinationNamespace: misc
calibre-web:
  enabled: false
  gitPath: kubernetes/helm-charts/applications/calibre-web
  destinationNamespace: books
cert-manager:
  enabled: false
  repo: oci://quay.io/jetstack/charts/cert-manager
  chart: cert-manager
  version: v1.20.0
  destinationNamespace: cert-manager
  defaultValues: |
    crds:
      enabled: true
crafty-server:
  enabled: false
  repo: oci://oci.trueforge.org/truecharts/crafty-4
  chart: mychart
  destinationNamespace: crafty
  version: 9.2.2
firefly-iii:
  enabled: false
  repo: https://firefly-iii.github.io/kubernetes/
  chart: firefly-iii-stack
  version: 0.9.1
  destinationNamespace: finance
flaresolverr:
  enabled: false
  gitPath: kubernetes/helm-charts/applications/flaresolverr
  destinationNamespace: videos
flashpaper:
  enabled: false
  gitPath: kubernetes/helm-charts/applications/flashpaper/
  destinationNamespace: misc
hashi-vault:
  enabled: false
  repo: https://helm.releases.hashicorp.com
  chart: vault
  version: 0.32.0
  destinationNamespace: vault
  dependentApps:
    vault-secrets-operator:
      repo: https://helm.releases.hashicorp.com
      chart: vault-secrets-operator
      version: 0.10.0
    vault-config:
      repo: https://github.com/AidanHilt/PersonalMonorepo
      gitPath: kubernetes/helm-charts/k8s-resources/vault-config
      useDefaultGitRevision: true
      followMasterConfig: true
# Note that this one isn't managed in main, but in homepage-config.yaml. This is because we need
# to make a deployment and ingress for each hostname, since we can't just build links using the
# hostname as a variable
homepage:
  multiHost: true
  enabled: false
  repo: https://jameswynn.github.io/helm-charts
  chart: homepage
  version: 2.1.0
  destinationNamespace: misc
  dependentApps:
    homepage-config:
      repo: https://github.com/AidanHilt/PersonalMonorepo
      gitPath: kubernetes/helm-charts/k8s-resources/homepage-config
      useDefaultGitRevision: true
      # Generates a mirror of the enabled status and hostname config as the config for this app
      followMasterConfig: true
immich:
  enabled: false
  gitPath: kubernetes/helm-charts/applications/immich
  destinationNamespace: immich
istio:
  enabled: false
  repo: https://istio-release.storage.googleapis.com/charts
  chart: istiod
  version: 1.30.3
  destinationNamespace: istio-system
  groupName: istio
istio-base:
  groupName: istio
  chart: base
istio-gateway:
  groupName: istio
  chart: gateway
istio-cni:
  groupName: istio
  chart: cni
kiali:
  groupName: istio
  repo: https://kiali.org/helm-charts
  chart: kiali-operator
  version: 1.81.0
ingress-config:
  groupName: istio
  repo: https://github.com/AidanHilt/PersonalMonorepo
  useDefaultGitRevision: true
  gitPath: kubernetes/helm-charts/k8s-resources/istio-ingress-config
  destinationNamespace: ""
  # Generates a mirror of the enabled status and hostname config as the config for this app
  followMasterConfig: true
it-tools:
  enabled: false
  gitPath: kubernetes/helm-charts/applications/it-tools
  destinationNamespace: misc
jellyfin:
  enabled: false
  gitPath: kubernetes/helm-charts/applications/jellyfin
  destinationNamespace: videos
  groupName: videos
jellyseerr:
  enabled: false
  gitPath: kubernetes/helm-charts/applications/jellyseerr
  destinationNamespace: videos
  groupName: videos
job-templates:
  enabled: false
  gitPath: kubernetes/helm-charts/k8s-resources/job-templates
  destinationNamespace: job-templates
knative:
  enabled: false
  repo: https://knative.github.io/operator
  chart: knative-operator
  version: 1.21.1
  destinationNamespace: knative
kyverno:
  enabled: false
  repo: https://kyverno.github.io/kyverno
  chart: kyverno
  version: 3.5.1
  destinationNamespace: kyverno
  syncOptions: ServerSideDiff=true,IncludeMutationWebhook=true
  syncWave: "-20"
  serverSideApply: true
  defaultValues: |
    admissionController:
      replicas: 3
    backgroundController:
      replicas: 3
    cleanupController:
      replicas: 3
    reportsController:
      replicas: 3
    webhookLabels:
      app.kubernetes.io/managed-by: argocd
  dependentApps:
    kyverno-policies:
      repo: https://github.com/AidanHilt/PersonalMonorepo
      gitPath: kubernetes/helm-charts/k8s-resources/kyverno-policies
      useDefaultGitRevision: true
lidarr:
  enabled: false
  gitPath: kubernetes/helm-charts/applications/lidarr
  destinationNamespace: music
longhorn:
  enabled: false
  repo: https://charts.longhorn.io
  chart: longhorn
  destinationNamespace: longhorn-system
  version: 1.8.0
  syncWave: "-10"
  defaultValues: |
    preUpgradeChecker:
