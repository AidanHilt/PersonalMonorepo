nextcloud:
  host: nextcloud.qa-cluster-lb.lan
  trustedDomains:
    - nextcloud.qa-cluster-lb.lan
  existingSecret:
    enabled: true
    secretName: nextcloud-config-secret
    usernameKey: username
    passwordKey: password

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: postgres-cluster-rw.postgres.svc.cluster.local
  existingSecret:
    enabled: true
    secretName: nextcloud-config-secret
    usernameKey: postgresUsername
    passwordKey: postgresPassword

objectStore:
  s3:
    enabled: true
    host: http://seaweedfs-s3.seaweedfs.svc.cluster.local
    bucket: nextcloud
    existingSecret: nextcloud-seaweedfs-creds
    secretKeys:
      accessKey: accessKey
      secretKey: secretKey

rbac:
  enabled: true
  serviceaccount:
    name: nextcloud
