meshConfig:
  trustDomain: cluster.local
  extensionProviders:
  - envoyExtAuthzHttp:
      headersToDownstreamOnAllow:
      - cookie
      - location
      headersToUpstreamOnAllow:
      - set-cookie
      - x-authentik-*
      includeRequestHeadersInCheck:
      - cookie
      - authorization
      pathPrefix: /outpost.goauthentik.io/auth/envoy
      port: 9000
      service: ak-outpost-main-outpost.authentik.svc.cluster.local
    name: authentik