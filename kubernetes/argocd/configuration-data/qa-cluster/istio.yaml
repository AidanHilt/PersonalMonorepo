global:
  proxy:
    seccompProfile:
      type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 128Mi
cni:
  enabled: true
meshConfig:
  trustDomain: cluster.local
  extensionProviders:
  - envoyExtAuthzHttp:
      headersToDownstreamOnDeny:
      - set-cookie
      - location
      headersToDownstreamOnAllow:
      - set-cookie
      headersToUpstreamOnAllow:
      - set-cookie
      - x-authentik-*
      includeRequestHeadersInCheck:
      - cookie
      - authorization
      pathPrefix: /outpost.goauthentik.io/auth/envoy
      port: 9000
      service: ak-outpost-proxy-outpost-qa-cluster-lb-lan.authentik.svc.cluster.local
    name: authentik