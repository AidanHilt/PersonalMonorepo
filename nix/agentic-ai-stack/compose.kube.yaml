# Opt-in override: mounts a scoped kubeconfig into the `pi` container
# (spec §6). Layered on top of the base compose.yaml automatically
# by start-agent.sh whenever it finds a kubeconfig on the host; you can
# also apply it by hand:
#
#   docker compose -f compose.yaml -f compose.kube.yaml up -d proxy
#   docker compose -f compose.yaml -f compose.kube.yaml run --rm pi
#
# Never mount a real/production kubeconfig — generate a scoped one with
# `nix run .#gen-kubeconfig` (see scripts/gen-kubeconfig.sh).

services:
  pi:
    volumes:
      - "${PI_KUBECONFIG_PATH:-${HOME}/.config/pi-sandbox/agent-kubeconfig.yaml}:/home/pi/.kube/config:ro"
