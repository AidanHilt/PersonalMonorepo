# Baked into the pkg-broker image at /etc/nix/nix.conf. Deliberately
# minimal — see README.md for the store-backend tradeoffs.
#
# sandbox = true: pkg-broker builds against a *chroot store*
# (NIX_REMOTE=local?root=/srv/shared-nix, see entrypoint.sh), whose
# logical store dir (/nix/store) differs from its physical location on
# disk ($ROOT/nix/store). The sandbox is what maps that physical
# location onto /nix/store inside every builder -- without it, a build
# tries to exec /nix/store/... paths against the broker IMAGE's own
# /nix/store instead of the chroot store's, and fails with something
# like "executing .../bash-static-5.3/bin/bash: No such file or
# directory". Enabling this needs user namespaces, mounts, and a
# mountable /proc inside the container -- see compose.yaml's pkg-broker
# `security_opt` entries (seccomp/apparmor/systempaths opt-outs) and
# entrypoint.sh's startup sandbox self-test, which refuses to start if
# this doesn't actually work.
sandbox = true
# Never silently fall back to an unsandboxed build if the sandbox can't
# be set up -- that would reintroduce the store-mismatch failure above
# instead of a clear error. entrypoint.sh's self-test exists precisely
# so this failure mode is caught at startup instead.
sandbox-fallback = false

# No multi-user build-users-group: pkg-broker runs single-user,
# unprivileged Nix (uid 10003) -- not a multi-user daemon setup. The
# build sandbox above still works single-user: it uses Linux user
# namespaces (not setuid build users) to give each build its own UID
# view, mapped back to pkg-broker's own uid outside the namespace. This
# applies with either store backend active (default/isolated store, or
# the host's real store via compose.pkgbroker-host-store.yaml) — see
# README.md.
build-users-group =

experimental-features = nix-command

substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
