# Baked into the pkg-broker image at /etc/nix/nix.conf. Deliberately
# minimal — see README.md for why sandboxing is off and what the
# store-backend tradeoffs are.
#
# sandbox = false: this container has no spare privilege to set up nix's
# usual build sandbox (user namespaces / bind mounts), and the actual
# security boundary for this whole stack is the container + network
# isolation (PROJECT-SPEC.md §2), not nix's own build sandbox. Builds
# still run as pkg-broker's own unprivileged uid, not root.
sandbox = false

# No multi-user build-users-group: pkg-broker runs single-user Nix,
# building as its own uid against its own store (default/isolated store
# backend) or the host's real store (compose.pkgbroker-host-store.yaml
# override) — see README.md.
build-users-group =

experimental-features = nix-command

substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDvrq0=
