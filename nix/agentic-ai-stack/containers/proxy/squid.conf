# Egress allowlist for the `pi` container's outbound traffic (spec §3.2.1).
#
# Design: pi is pointed at this proxy via HTTPS_PROXY/HTTP_PROXY. Squid
# never terminates TLS (no ssl_bump splice/bump of content) — it only
# inspects the CONNECT target (SNI, via peek) to decide whether the
# destination is allowlisted, then splices the raw TLS stream through
# unmodified. Anything not on the allowlist is refused at CONNECT time.


http_port 3128

# --- TLS SNI inspection (no interception/decryption of content) -----
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump splice all

# --- Allowlisted destinations ----------------------------------------
acl allowed_model_providers ssl::server_name .anthropic.com
acl allowed_model_providers ssl::server_name .openai.com
acl allowed_model_providers ssl::server_name .googleapis.com

# Package registries — only needed if the permission policy allows pi
# to run `npm install` / extension installs at runtime. Comment out
# any registry you don't want reachable.
acl allowed_registries ssl::server_name .npmjs.org
acl allowed_registries ssl::server_name registry.npmjs.org
acl allowed_registries ssl::server_name .pypi.org
acl allowed_registries ssl::server_name files.pythonhosted.org
acl allowed_registries ssl::server_name github.com
acl allowed_registries ssl::server_name .githubusercontent.com
acl allowed_registries ssl::server_name codeload.github.com
acl allowed_registries ssl::server_name api.github.com

acl allowed_dst dstdomain "/etc/squid/allowed-domains.txt"

# Session-scoped, runtime-added domains (domain-gate service, see
# containers/proxy/domain-gate/main.go). Lives on tmpfs under /tmp, so
# it's always empty on container start and never persists a grant across
# a proxy restart. Same ACL type (dstdomain) as allowed_dst above, so it
# behaves identically for CONNECT/SNI-peeked requests -- exact-hostname
# match only, no subdomain wildcarding (domain-gate never writes a
# leading-dot entry).
acl allowed_dynamic dstdomain "/tmp/proxy-runtime/dynamic-domains.txt"

acl SSL_ports port 443
acl CONNECT method CONNECT

# Only allow CONNECT (i.e. HTTPS) — never plaintext HTTP egress.
http_access deny CONNECT !SSL_ports
http_access deny !CONNECT

http_access allow allowed_model_providers
http_access allow allowed_registries
http_access allow allowed_dst
http_access allow allowed_dynamic

# Default deny, logged, for anything else.
http_access deny all

# --- Hardening --------------------------------------------------------
# Minimal own attack surface (spec §3.2): no cache, no disk, no unneeded
# helpers, no revealing internal request headers to upstream.
cache deny all
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all

# Don't listen anywhere except the internal compose network interface;
# compose.yaml doesn't publish this port, so it's unreachable from the
# host or the external network regardless.


# --- Runtime paths (must not resolve into the read-only Nix store) ---

# PID file
pid_filename /tmp/proxy-runtime/squid.pid

# Main squid log (errors, worker startup/shutdown, etc.)
cache_log /tmp/proxy-runtime/cache.log

# Access log — the request log. `none` disables it entirely if you
# don't need it; otherwise point it at your writable log mount.
# access_log /var/log/squid/access.log squid
access_log /tmp/proxy-runtime/access.log squid

# Store/swap metadata log — obsolete/no-op on modern squid with
# cache_dir disabled, but explicit is safer than relying on a
# compiled-in default path.
cache_store_log none

# Where squid dumps core on a crash. Defaults to localstatedir too;
# point it at writable scratch space (or /dev/null-equivalent via
# omitting entirely if you don't want core dumps at all — but then
# leave the directive out rather than pointing at a bad path).
coredump_dir /tmp/proxy-runtime

# On-disk cache. Since you're not caching (this is an egress
# allowlist proxy, not a caching proxy), the simplest and safest
# option is to disable disk caching outright:
cache_dir null /tmp/squid-cache

# If you DO want disk caching enabled instead, replace the line above
# with something like:
# cache_dir ufs /tmp/squid-cache 100 16 256
# — but note /tmp/squid-cache is tmpfs (RAM-backed, 64m in your
# compose file), so a UFS cache_dir there is really just an in-memory
# cache with extra bookkeeping overhead; consider bumping tmpfs size
# accordingly if you go this route, or just rely on squid's built-in
# memory cache (cache_mem) instead of a disk cache_dir at all.