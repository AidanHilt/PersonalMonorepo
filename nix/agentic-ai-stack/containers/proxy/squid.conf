# Egress allowlist for the `pi` container's outbound traffic (spec §3.2.1).
#
# Design: pi is pointed at this proxy via HTTPS_PROXY/HTTP_PROXY. Squid
# never terminates TLS (no ssl_bump splice/bump of content) — it only
# inspects the CONNECT target (SNI, via peek) to decide whether the
# destination is allowlisted, then splices the raw TLS stream through
# unmodified. Anything not on the allowlist is refused at CONNECT time.
#
# TODO for implementer: this allowlist is deliberately narrow. Add
# entries only as needed — every domain here is a hole in the sandbox
# boundary. Package-registry entries are only needed if pi is allowed
# to install extensions/packages at runtime; comment them out if not.

http_port 3128

# --- TLS SNI inspection (no interception/decryption of content) -----
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump splice all

# --- Allowlisted destinations ----------------------------------------
acl allowed_model_providers ssl::server_name .anthropic.com
acl allowed_model_providers ssl::server_name .openai.com
acl allowed_model_providers ssl::server_name .googleapis.com

# Package registries — only needed if the permission policy allows pi
# to run `npm install` / extension installs at runtime. Comment out
# any registry you don't want reachable.
acl allowed_registries ssl::server_name .npmjs.org
acl allowed_registries ssl::server_name registry.npmjs.org
acl allowed_registries ssl::server_name .pypi.org
acl allowed_registries ssl::server_name files.pythonhosted.org
acl allowed_registries ssl::server_name github.com
acl allowed_registries ssl::server_name .githubusercontent.com
acl allowed_registries ssl::server_name codeload.github.com
acl allowed_registries ssl::server_name api.github.com

acl allowed_dst dstdomain "/etc/squid/allowed-domains.txt"

acl SSL_ports port 443
acl CONNECT method CONNECT

# Only allow CONNECT (i.e. HTTPS) — never plaintext HTTP egress.
http_access deny CONNECT !SSL_ports
http_access deny !CONNECT

http_access allow allowed_model_providers
http_access allow allowed_registries
http_access allow allowed_dst

# Default deny, logged, for anything else.
http_access deny all

# --- Hardening --------------------------------------------------------
# Minimal own attack surface (spec §3.2): no cache, no disk, no unneeded
# helpers, no revealing internal request headers to upstream.
cache deny all
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all

# Don't listen anywhere except the internal compose network interface;
# compose.yaml doesn't publish this port, so it's unreachable from the
# host or the external network regardless.
